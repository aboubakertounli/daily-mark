# One commit per day on main, so the contribution graph gets a square.
# Day A: create MARK. Day B: delete it. Repeat.
# GitHub may start the cron later than 07:00 Morocco. The date is still that day.

name: Daily mark

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add or remove one letter
        run: |
          git config user.name "aboubakertounli"
          git config user.email "242292047+aboubakertounli@users.noreply.github.com"
          today=$(date -u +%Y-%m-%d)
          last=$(git log -1 --format=%cs || true)
          if [ "$last" = "$today" ]; then
            echo "Already committed today ($today)."
            exit 0
          fi
          if [ -f MARK ]; then
            git rm MARK
          else
            printf 'a' > MARK
            git add MARK
          fi
          git commit -m "Daily mark $today"
          git push
